<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offre</title><style>body{font-family:Arial;max-width:650px;margin:40px auto;padding:0 20px}form{display:grid;gap:15px}label{display:block;font-weight:bold;margin-bottom:5px}input,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #94a3b8;border-radius:6px}button,a{padding:10px 14px;border:0;border-radius:6px;background:#2563eb;color:#fff;text-decoration:none;cursor:pointer}.cancel{background:#475569}.errorlist{color:#b91c1c;padding-left:20px}</style></head><body><h1>{% if object %}Modifier{% else %}Ajouter{% endif %} une offre</h1><p>Sélectionnez une expédition publiée et un véhicule appartenant au transporteur choisi.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<div><button>Enregistrer</button> <a class="cancel" href="{% url 'offre_list' %}">Annuler</a></div></form></body></html>
