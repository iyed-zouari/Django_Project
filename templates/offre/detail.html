<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Offre #{{ offre.pk }}</title><style>body{font-family:Arial;max-width:650px;margin:40px auto;padding:0 20px}dl{display:grid;grid-template-columns:max-content 1fr;gap:12px 20px}dt{font-weight:bold}a{display:inline-block;padding:10px 14px;border-radius:6px;background:#2563eb;color:#fff;text-decoration:none}.secondary{background:#475569}</style></head><body><h1>Offre #{{ offre.pk }}</h1><dl><dt>Expédition</dt><dd>{{ offre.expedition.reference }}</dd><dt>Transporteur</dt><dd>{{ offre.transporteur }}</dd><dt>Véhicule</dt><dd>{{ offre.vehicule }}</dd><dt>Prix</dt><dd>{{ offre.prix }} TND</dd><dt>Délai</dt><dd>{{ offre.delai_jours }} jour(s)</dd><dt>Statut</dt><dd>{{ offre.get_statut_display }}</dd></dl><a href="{% url 'offre_update' offre.pk %}">Modifier</a> <a class="secondary" href="{% url 'offre_list' %}">Retour</a></body></html>
