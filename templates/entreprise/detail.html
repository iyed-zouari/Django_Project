<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>{{ entreprise.raison_sociale }}</title><style>body{font-family:Arial;max-width:650px;margin:40px auto;padding:0 20px}dl{display:grid;grid-template-columns:max-content 1fr;gap:12px 20px}dt{font-weight:bold}a{display:inline-block;padding:10px 14px;border-radius:6px;background:#2563eb;color:white;text-decoration:none}.secondary{background:#475569}</style></head><body><h1>{{ entreprise.raison_sociale }}</h1><dl><dt>Matricule fiscal</dt><dd>{{ entreprise.matricule_fiscal }}</dd><dt>Type</dt><dd>{{ entreprise.get_type_entreprise_display }}</dd><dt>Adresse</dt><dd>{{ entreprise.adresse }}</dd><dt>Gérant</dt><dd>{{ entreprise.gerant }}</dd></dl><a href="{% url 'entreprise_update' entreprise.pk %}">Modifier</a> <a class="secondary" href="{% url 'entreprise_list' %}">Retour</a></body></html>
