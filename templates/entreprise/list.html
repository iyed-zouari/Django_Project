{% extends 'base.html' %}
{% block title %}Mon entreprise{% endblock %}
{% block content %}
<h1>Mon entreprise</h1>
{% for entreprise in entreprises %}
<article class="row">
    <div><strong>{{ entreprise.raison_sociale }}</strong><br><span class="muted">{{ entreprise.get_type_entreprise_display }} · {{ entreprise.matricule_fiscal }}</span></div>
    <a class="button secondary" href="{% url 'entreprise_detail' entreprise.pk %}">Voir</a>
</article>
{% endfor %}
{% endblock %}
