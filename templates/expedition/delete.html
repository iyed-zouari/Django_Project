<div class="delete-container">
    <div class="delete-card">
        <h2>Supprimer l'expédition</h2>
        <p>Êtes-vous sûr de vouloir supprimer cette expédition ?</p>

        <form method="post" class="delete-form">
            {% csrf_token %}
            <div class="delete-actions">
                <button type="submit" class="btn btn-danger">Oui, supprimer</button>
                <a href="{% url 'listview_expeditions' %}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

<style>
    .delete-container {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
        font-family: Arial, sans-serif;
    }

    .delete-card {
        width: min(100%, 500px);
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        padding: 32px 28px;
        text-align: center;
    }

    .delete-card h2 {
        margin: 0 0 16px;
        color: #1f2937;
        font-size: 1.8rem;
    }

    .delete-card p {
        margin: 0 0 24px;
        color: #475569;
        font-size: 1rem;
        line-height: 1.6;
    }

    .delete-form {
        display: flex;
        justify-content: center;
    }

    .delete-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.2s ease;
        border: none;
        cursor: pointer;
    }

    .btn-danger {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: #fff;
        box-shadow: 0 8px 18px rgba(239, 68, 68, 0.25);
    }

    .btn-secondary {
        background: #e2e8f0;
        color: #0f172a;
    }

    .btn:hover {
        transform: translateY(-1px);
    }
</style>
