
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
        margin: 0;
        padding: 40px 20px;
        color: #1f2937;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
        padding: 30px;
    }

    h1 {
        text-align: center;
        color: #0f172a;
        margin-bottom: 25px;
        font-size: 2rem;
    }

    .expedition-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .expedition-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 18px 20px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .expedition-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }

    .expedition-info {
        flex: 1;
        min-width: 0;
    }

    .expedition-title {
        display: inline-block;
        font-weight: 700;
        color: #1d4ed8;
        text-decoration: none;
        margin-right: 8px;
    }

    .expedition-title:hover {
        text-decoration: underline;
    }

    .expedition-meta {
        color: #475569;
        margin-top: 6px;
        font-size: 0.95rem;
    }

    .action-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .btn {
        display: inline-block;
        text-decoration: none;
        border: none;
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s ease;
    }

    .btn:hover {
        opacity: 0.9;
    }

    .btn-delete {
        background: #fee2e2;
        color: #b91c1c;
    }

    .btn-update {
        background: #dbeafe;
        color: #1d4ed8;
    }

    .btn-create {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        margin-top: 20px;
        width: 100%;
        background: #0f172a;
        color: #ffffff;
        padding: 12px 18px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 700;
    }
</style>

<div class="container">
    <h1>Liste des Expéditions</h1>

    <ul class="expedition-list">
        {% for expedition in liste %}
            <li class="expedition-item">
                <div class="expedition-info">
                    <a href="{% url 'detailview_expedition' expedition.pk %}" class="expedition-title">
                        {{ expedition.reference }}
                    </a>
                    <span>- {{ expedition.entreprise }} ({{ expedition.poids_kg }} kg)</span>
                </div>

                <div class="action-buttons">
                    <a href="{% url 'updateview_expedition' expedition.pk %}" class="btn btn-update">Modifier</a>
                    <a href="{% url 'deleteview_expedition' expedition.pk %}" class="btn btn-delete" onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette expédition ?');">Supprimer</a>
                </div>
            </li>
        {% endfor %}

        <li>
            <a href="{% url 'createview_expedition' %}" class="btn btn-create">Créer une nouvelle expédition</a>
        </li>
    </ul>
</div>
