<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des expéditions</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 16px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #eef4ff, #f8fafc 55%, #e8f3f1);
            color: #172033;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(100%, 620px);
            padding: 36px;
            background: #fff;
            border: 1px solid #e5eaf2;
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(34, 54, 91, .12);
        }
        .eyebrow {
            margin: 0 0 8px;
            color: #2563eb;
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }
        h1 { margin: 0 0 28px; font-size: clamp(1.6rem, 5vw, 2rem); }
        form p { margin: 0 0 18px; }
        form label { display: block; margin-bottom: 7px; font-weight: 600; }
        input, select, textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #fff;
            color: inherit;
            font: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .16);
        }
        .errorlist { margin: 6px 0 0; padding-left: 20px; color: #b91c1c; font-size: .9rem; }
        .actions { display: flex; align-items: center; gap: 12px; margin-top: 28px; }
        button, .cancel {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-height: 44px;
            padding: 10px 18px;
            border-radius: 9px;
            font: inherit;
            font-weight: 650;
            text-decoration: none;
            cursor: pointer;
        }
        button { border: 0; background: #2563eb; color: #fff; }
        button:hover { background: #1d4ed8; }
        .cancel { border: 1px solid #d5dce7; color: #475569; }
        .cancel:hover { background: #f8fafc; }
        @media (max-width: 480px) {
            main { padding: 26px 20px; }
            .actions { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Gestion des expéditions</p>
        {% if object %}
            <h1>Modifier l'expédition {{ object.id }}</h1>
        {% else %}
            <h1>Créer une nouvelle expédition</h1>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions">
                <button type="submit">Enregistrer</button>
                <a class="cancel" href="{% url 'listview_expeditions' %}">Annuler</a>
            </div>
        </form>
    </main>

</body>
</html>
