<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ vehicule.immatriculation }}</title><style>body{font-family:Arial,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;color:#1f2937}dl{display:grid;grid-template-columns:max-content 1fr;gap:12px 24px}dt{font-weight:bold}a{display:inline-block;padding:10px 14px;border-radius:6px;background:#2563eb;color:#fff;text-decoration:none}.secondary{background:#475569}</style></head>
<body><h1>{{ vehicule.immatriculation }}</h1><dl><dt>Type</dt><dd>{{ vehicule.get_type_vehicule_display }}</dd><dt>Capacité</dt><dd>{{ vehicule.capacite_kg }} kg</dd><dt>Entreprise</dt><dd>{{ vehicule.entreprise }}</dd><dt>Statut</dt><dd>{% if vehicule.disponible %}Disponible{% else %}Indisponible{% endif %}</dd></dl><a href="{% url 'vehicule_update' vehicule.pk %}">Modifier</a> <a class="secondary" href="{% url 'vehicule_list' %}">Retour</a></body></html>
