<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Supprimer un véhicule</title><style>body{font-family:Arial,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;color:#1f2937}button,a{display:inline-block;padding:10px 14px;border:0;border-radius:6px;color:#fff;text-decoration:none;cursor:pointer}button{background:#dc2626}.cancel{background:#475569}</style></head>
<body><h1>Supprimer le véhicule</h1><p>Voulez-vous vraiment supprimer <strong>{{ vehicule.immatriculation }}</strong> ? Cette action est irréversible.</p><form method="post">{% csrf_token %}<button type="submit">Supprimer</button> <a class="cancel" href="{% url 'vehicule_detail' vehicule.pk %}">Annuler</a></form></body></html>
